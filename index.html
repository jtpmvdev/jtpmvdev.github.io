<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widgets GRIST</title>
    <style>
        /* ── Réinitialisation & base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e1e2f 0%, #2d2b55 50%, #3a2f6b 100%);
            color: #eaeaf0;
            padding: 2rem;
        }

        /* ── Carte principale ── */
        .card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 3rem 4rem;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.8s ease-out;
            max-width: 600px;
        }

        /* ── Titre ── */
        h3 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #7c6cff, #00d4ff, #ff6ec7);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            position: relative;
        }

        /* Petit trait décoratif sous le titre */
        h3::after {
            content: '';
            display: block;
            width: 80px;
            height: 4px;
            margin: 1.2rem auto 0;
            border-radius: 4px;
            background: linear-gradient(90deg, #7c6cff, #00d4ff);
        }

        /* ── Sous-texte (facultatif) ── */
        .subtitle {
            margin-top: 1.5rem;
            font-size: 1rem;
            color: #a8a8c0;
            line-height: 1.6;
        }

        /* ── Animation d'apparition ── */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            .card {
                padding: 2rem 1.5rem;
            }
            h3 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h3>Tests de Widgets GRIST</h3>
        <p class="subtitle">
            Espace de test et d'expérimentation des widgets personnalisés.
        </p>
    </div>
</body>
</html>
