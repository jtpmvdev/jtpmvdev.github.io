<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Import CSV vers Grist</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 1rem;
    }
    .dashed-border {
      background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='16' ry='16' stroke='%23CBD5E1FF' stroke-width='3' stroke-dasharray='8%2c 8' stroke-dashoffset='0' stroke-linecap='square'/%3e%3c/svg%3e");
      border-radius: 16px;
    }
    .dashed-border.drag-over {
      background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='16' ry='16' stroke='%236366F1FF' stroke-width='3' stroke-dasharray='8%2c 8' stroke-dashoffset='0' stroke-linecap='square'/%3e%3c/svg%3e");
      background-color: #EEF2FF;
    }
  </style>
</head>
<body class="p-4">

  <div class="bg-white rounded-2xl shadow-2xl p-6 sm:p-8 max-w-md w-full text-center">
    
    <div class="flex items-center justify-center gap-2 mb-1">
      <span class="text-2xl">📊</span>
      <h1 class="text-2xl font-bold text-slate-800">Import de fichier CSV</h1>
    </div>
    <p class="text-sm text-slate-500 mb-6">Glissez votre fichier CSV pour créer une nouvelle table</p>

    <div 
      id="drop-zone" 
      class="dashed-border p-8 mb-4 flex flex-col items-center justify-center cursor-pointer transition-all duration-200 hover:bg-slate-50"
    >
      <input type="file" id="file-input" accept=".csv" class="hidden" />

      <div id="upload-prompt" class="flex flex-col items-center">
        <div class="w-16 h-16 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 mb-4">
          <i data-lucide="cloud-upload" class="w-8 h-8"></i>
        </div>
        <p class="text-slate-700 font-medium mb-1">Glissez votre fichier CSV ici</p>
        <p class="text-sm text-slate-400">ou <span class="text-indigo-600 font-semibold underline">parcourez vos fichiers</span></p>
      </div>

      <div id="file-info" class="hidden flex flex-col items-center w-full">
        <div class="w-12 h-12 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center mb-2">
          <i data-lucide="file-spreadsheet" class="w-6 h-6"></i>
        </div>
        <p id="file-name" class="font-semibold text-slate-700 truncate max-w-full px-2">donnees.csv</p>
        <p id="file-details" class="text-xs text-slate-400 mt-0.5">0 colonnes, 0 lignes</p>
        <button id="remove-file" type="button" class="mt-3 text-xs text-red-500 hover:text-red-700 font-medium flex items-center gap-1">
          <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Changer de fichier
        </button>
      </div>
    </div>

    <div id="table-name-container" class="hidden text-left mb-6">
      <label for="table-name" class="block text-xs font-semibold text-slate-600 mb-1">Nom de la nouvelle table :</label>
      <input 
        type="text" 
        id="table-name" 
        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" 
        placeholder="MaNouvelleTable"
      />
      <label class="block text-xs font-semibold text-slate-600 mb-1 mt-3">Comportement si la table existe :</label>
      <select id="if-exists" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <option value="append">Ajouter les lignes à la table existante</option>
        <option value="replace">Vider la table puis importer</option>
        <option value="rename">Créer une nouvelle table avec un nom suffixé</option>
      </select>
    </div>

    <div id="status-message" class="hidden mb-4 p-3 rounded-lg text-sm font-medium"></div>

    <button 
      id="submit-btn" 
      disabled 
      class="w-full py-3.5 px-4 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-semibold rounded-xl shadow-lg shadow-indigo-200 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed disabled:shadow-none flex items-center justify-center gap-2"
    >
      <span id="btn-text">Créer la table</span>
      <i id="btn-spinner" data-lucide="loader-2" class="w-5 h-5 animate-spin hidden"></i>
    </button>
  </div>

  <script>
    lucide.createIcons();

    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const uploadPrompt = document.getElementById('upload-prompt');
    const fileInfo = document.getElementById('file-info');
    const fileName = document.getElementById('file-name');
    const fileDetails = document.getElementById('file-details');
    const removeFileBtn = document.getElementById('remove-file');
    const tableNameInput = document.getElementById('table-name');
    const tableNameContainer = document.getElementById('table-name-container');
    const ifExistsSelect = document.getElementById('if-exists');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const statusMessage = document.getElementById('status-message');

    let csvHeaders = [];
    let csvRows = [];

    grist.ready({ requiredAccess: 'full' });

    dropZone.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) parseCSV(e.target.files[0]);
    });

    ['dragenter', 'dragover'].forEach(name => {
      dropZone.addEventListener(name, (e) => {
        e.preventDefault();
        dropZone.classList.add('drag-over');
      });
    });

    ['dragleave', 'drop'].forEach(name => {
      dropZone.addEventListener(name, (e) => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
      });
    });

    dropZone.addEventListener('drop', (e) => {
      if (e.dataTransfer.files.length > 0) parseCSV(e.dataTransfer.files[0]);
    });

    function sanitizeId(name) {
      return String(name).trim().replace(/[^a-zA-Z0-9_]/g, "_") || "Table";
    }

    function parseCSV(file) {
      if (!file.name.endsWith('.csv')) {
        showStatus('Veuillez sélectionner un fichier au format .csv', 'error');
        return;
      }

      Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          if (results.data.length === 0) {
            showStatus('Le fichier CSV est vide.', 'error');
            return;
          }

          csvHeaders = results.meta.fields || [];
          csvRows = results.data;

          fileName.textContent = file.name;
          fileDetails.textContent = `${csvHeaders.length} colonnes, ${csvRows.length} lignes`;

          const suggestedName = sanitizeId(file.name.replace(/\.[^/.]+$/, ""));
          tableNameInput.value = suggestedName;

          uploadPrompt.classList.add('hidden');
          fileInfo.classList.remove('hidden');
          tableNameContainer.classList.remove('hidden');
          submitBtn.disabled = false;
          hideStatus();
        },
        error: function(err) {
          showStatus('Erreur de lecture du CSV : ' + err.message, 'error');
        }
      });
    }

    removeFileBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      resetForm();
    });

    function resetForm() {
      csvHeaders = [];
      csvRows = [];
      fileInput.value = '';
      uploadPrompt.classList.remove('hidden');
      fileInfo.classList.add('hidden');
      tableNameContainer.classList.add('hidden');
      submitBtn.disabled = true;
    }

    /**
     * Construit la liste des colonnes à partir des en-têtes CSV.
     */
    function buildColumns() {
      const usedColIds = new Set(["id"]);
      return csvHeaders.map((header, index) => {
        const baseId = sanitizeId(header) || `colonne_${index + 1}`;
        let colId = baseId;
        let suffix = 2;
        while (usedColIds.has(colId)) {
          colId = `${baseId}_${suffix++}`;
        }
        usedColIds.add(colId);

        return {
          id: colId,
          label: (header || "").trim() || `Colonne ${index + 1}`,
          type: "Text"
        };
      });
    }

    /**
     * Vérifie si une table existe via l'API doc.
     */
    async function tableExists(tableId) {
      try {
        const tables = await grist.docApi.listTables();
        return Array.isArray(tables) && tables.includes(tableId);
      } catch (e) {
        return false;
      }
    }

    /**
     * Trouve un identifiant de table unique en ajoutant un suffixe numérique.
     */
    async function findAvailableTableId(baseId) {
      let candidate = baseId;
      let i = 2;
      while (await tableExists(candidate)) {
        candidate = `${baseId}_${i++}`;
      }
      return candidate;
    }

    /**
     * Crée une table via l'action AddTable.
     * Retourne l'identifiant réel de la table créée.
     */
    async function createTable(tableId, columns) {
      const result = await grist.docApi.applyUserActions([
        ["AddTable", tableId, columns]
      ]);

      // AddTable renvoie typiquement [tableId] dans le tableau de résultats.
      const first = result && result[0];
      let createdId = tableId;
      if (Array.isArray(first) && typeof first[0] === "string") {
        createdId = first[0];
      } else if (first && typeof first === "object") {
        createdId = first.table_id || first.tableId || tableId;
      }

      // On s'assure que la table existe bien.
      if (!(await tableExists(createdId))) {
        throw new Error(
          `La table "${createdId}" n'a pas été créée. Tables disponibles : ` +
          (await grist.docApi.listTables()).join(", ")
        );
      }
      return createdId;
    }

    /**
     * Ajoute les colonnes manquantes à une table existante.
     */
    async function ensureColumns(tableId, columns) {
      const existing = await grist.docApi.fetchTable(tableId).catch(() => null);
      // fetchTable renvoie un objet { id: [...], colA: [...], ... }
      const existingCols = existing ? Object.keys(existing) : [];

      const actions = [];
      for (const col of columns) {
        if (!existingCols.includes(col.id)) {
          actions.push(["AddColumn", tableId, col.id, {
            label: col.label,
            type: col.type
          }]);
        }
      }
      if (actions.length > 0) {
        await grist.docApi.applyUserActions(actions);
      }

      // On retourne la liste finale des colonnes de la table (ordre réel).
      const refreshed = await grist.docApi.fetchTable(tableId);
      return Object.keys(refreshed).filter(k => k !== "id" && k !== "manualSort");
    }

    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    submitBtn.addEventListener('click', async () => {
      const rawName = tableNameInput.value.trim();
      const baseTableId = sanitizeId(rawName);
      if (!baseTableId) {
        showStatus('Veuillez saisir un nom valide pour la table.', 'error');
        return;
      }

      const ifExists = ifExistsSelect.value;

      setLoading(true);

      try {
        const columns = buildColumns();
        const exists = await tableExists(baseTableId);

        let targetTableId = baseTableId;
        let finalColumns = columns;

        if (!exists) {
          // ---- CAS 1 : la table n'existe pas -> on la crée ----
          targetTableId = await createTable(baseTableId, columns);
          finalColumns = columns;
        } else {
          // ---- CAS 2 : la table existe déjà ----
          if (ifExists === "rename") {
            targetTableId = await findAvailableTableId(baseTableId);
            targetTableId = await createTable(targetTableId, columns);
            finalColumns = columns;
          } else if (ifExists === "replace") {
            // Vider la table puis ajouter les colonnes manquantes.
            targetTableId = baseTableId;
            const existing = await grist.docApi.fetchTable(targetTableId);
            const rowIds = existing && existing.id ? existing.id.slice() : [];
            if (rowIds.length > 0) {
              const removeActions = rowIds.map(rid => ["RemoveRecord", targetTableId, rid]);
              // Suppression par lots
              const batch = 100;
              for (let i = 0; i < removeActions.length; i += batch) {
                await grist.docApi.applyUserActions(removeActions.slice(i, i + batch));
              }
            }
            finalColumns = await ensureColumns(targetTableId, columns);
          } else {
            // append (par défaut)
            targetTableId = baseTableId;
            finalColumns = await ensureColumns(targetTableId, columns);
          }
        }

        // Reconstruire le mapping header -> colId final
        const headerToColId = {};
        csvHeaders.forEach((header, index) => {
          const desiredId = sanitizeId(header) || `colonne_${index + 1}`;
          // On cherche la colonne correspondante dans finalColumns
          let match = finalColumns.find(c => c === desiredId);
          if (!match) {
            // essayer avec suffixe éventuel
            match = finalColumns.find(c => c.startsWith(desiredId + "_"));
          }
          headerToColId[header] = match || finalColumns[index] || desiredId;
        });

        // Préparer les actions d'insertion
        const addRecordActions = csvRows.map(row => {
          const recordFields = {};
          csvHeaders.forEach((header) => {
            const colId = headerToColId[header];
            if (!colId) return;
            const value = row[header];
            recordFields[colId] =
              value !== undefined && value !== null ? String(value) : "";
          });
          return ["AddRecord", targetTableId, null, recordFields];
        });

        const batchSize = 100;
        for (let i = 0; i < addRecordActions.length; i += batchSize) {
          await grist.docApi.applyUserActions(
            addRecordActions.slice(i, i + batchSize)
          );
        }

        showStatus(
          `Table "${targetTableId}" prête : ${csvRows.length} lignes importées avec succès !`,
          'success'
        );
        resetForm();
      } catch (err) {
        console.error("Erreur Grist :", err);
        showStatus("Erreur lors de l'import : " + (err.message || err), "error");
      } finally {
        setLoading(false);
      }
    });

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      if (isLoading) {
        btnText.textContent = 'Création et import en cours...';
        btnSpinner.classList.remove('hidden');
      } else {
        btnText.textContent = 'Créer la table';
        btnSpinner.classList.add('hidden');
      }
    }

    function showStatus(text, type) {
      statusMessage.textContent = text;
      statusMessage.classList.remove('hidden', 'bg-green-100', 'text-green-700', 'bg-red-100', 'text-red-700');
      if (type === 'success') {
        statusMessage.classList.add('bg-green-100', 'text-green-700');
      } else {
        statusMessage.classList.add('bg-red-100', 'text-red-700');
      }
    }

    function hideStatus() {
      statusMessage.classList.add('hidden');
    }
  </script>
</body>
</html>
