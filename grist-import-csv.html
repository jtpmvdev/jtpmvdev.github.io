<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Import CSV vers Grist</title>
  <!-- SDK Grist -->
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- PapaParse pour lire les CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 1rem;
    }
    .dashed-border {
      background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='16' ry='16' stroke='%23CBD5E1FF' stroke-width='3' stroke-dasharray='8%2c 8' stroke-dashoffset='0' stroke-linecap='square'/%3e%3c/svg%3e");
      border-radius: 16px;
    }
    .dashed-border.drag-over {
      background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='16' ry='16' stroke='%236366F1FF' stroke-width='3' stroke-dasharray='8%2c 8' stroke-dashoffset='0' stroke-linecap='square'/%3e%3c/svg%3e");
      background-color: #EEF2FF;
    }
  </style>
</head>
<body class="p-4">

  <div class="bg-white rounded-2xl shadow-2xl p-6 sm:p-8 max-w-md w-full text-center">
    
    <!-- En-tête -->
    <div class="flex items-center justify-center gap-2 mb-1">
      <span class="text-2xl">📊</span>
      <h1 class="text-2xl font-bold text-slate-800">Import de fichier CSV</h1>
    </div>
    <p class="text-sm text-slate-500 mb-6">Glissez votre fichier CSV pour créer une nouvelle table</p>

    <!-- Zone de Drop -->
    <div 
      id="drop-zone" 
      class="dashed-border p-8 mb-4 flex flex-col items-center justify-center cursor-pointer transition-all duration-200 hover:bg-slate-50"
    >
      <input type="file" id="file-input" accept=".csv" class="hidden" />

      <div id="upload-prompt" class="flex flex-col items-center">
        <div class="w-16 h-16 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 mb-4">
          <i data-lucide="cloud-upload" class="w-8 h-8"></i>
        </div>
        <p class="text-slate-700 font-medium mb-1">Glissez votre fichier CSV ici</p>
        <p class="text-sm text-slate-400">ou <span class="text-indigo-600 font-semibold underline">parcourez vos fichiers</span></p>
      </div>

      <div id="file-info" class="hidden flex flex-col items-center w-full">
        <div class="w-12 h-12 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center mb-2">
          <i data-lucide="file-spreadsheet" class="w-6 h-6"></i>
        </div>
        <p id="file-name" class="font-semibold text-slate-700 truncate max-w-full px-2">donnees.csv</p>
        <p id="file-details" class="text-xs text-slate-400 mt-0.5">0 colonnes, 0 lignes</p>
        <button id="remove-file" type="button" class="mt-3 text-xs text-red-500 hover:text-red-700 font-medium flex items-center gap-1">
          <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Changer de fichier
        </button>
      </div>
    </div>

    <!-- Nom de la nouvelle table -->
    <div id="table-name-container" class="hidden text-left mb-6">
      <label for="table-name" class="block text-xs font-semibold text-slate-600 mb-1">Nom de la nouvelle table :</label>
      <input 
        type="text" 
        id="table-name" 
        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" 
        placeholder="MaNouvelleTable"
      />
    </div>

    <!-- Message de statut -->
    <div id="status-message" class="hidden mb-4 p-3 rounded-lg text-sm font-medium"></div>

    <!-- Bouton d'action -->
    <button 
      id="submit-btn" 
      disabled 
      class="w-full py-3.5 px-4 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-semibold rounded-xl shadow-lg shadow-indigo-200 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed disabled:shadow-none flex items-center justify-center gap-2"
    >
      <span id="btn-text">Créer la table</span>
      <i id="btn-spinner" data-lucide="loader-2" class="w-5 h-5 animate-spin hidden"></i>
    </button>
  </div>

  <script>
    lucide.createIcons();

    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const uploadPrompt = document.getElementById('upload-prompt');
    const fileInfo = document.getElementById('file-info');
    const fileName = document.getElementById('file-name');
    const fileDetails = document.getElementById('file-details');
    const removeFileBtn = document.getElementById('remove-file');
    const tableNameInput = document.getElementById('table-name');
    const tableNameContainer = document.getElementById('table-name-container');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const statusMessage = document.getElementById('status-message');

    let csvHeaders = [];
    let csvRows = [];

    // Configuration Grist
    grist.ready({ requiredAccess: 'full' });

    dropZone.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) parseCSV(e.target.files[0]);
    });

    ['dragenter', 'dragover'].forEach(name => {
      dropZone.addEventListener(name, (e) => {
        e.preventDefault();
        dropZone.classList.add('drag-over');
      });
    });

    ['dragleave', 'drop'].forEach(name => {
      dropZone.addEventListener(name, (e) => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
      });
    });

    dropZone.addEventListener('drop', (e) => {
      if (e.dataTransfer.files.length > 0) parseCSV(e.dataTransfer.files[0]);
    });

    function parseCSV(file) {
      if (!file.name.endsWith('.csv')) {
        showStatus('Veuillez sélectionner un fichier au format .csv', 'error');
        return;
      }

      Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          if (results.data.length === 0) {
            showStatus('Le fichier CSV est vide.', 'error');
            return;
          }

          csvHeaders = results.meta.fields || [];
          csvRows = results.data;

          fileName.textContent = file.name;
          fileDetails.textContent = `${csvHeaders.length} colonnes, ${csvRows.length} lignes`;

          // Nom de table propre
          const suggestedName = file.name
            .replace(/\.[^/.]+$/, "")
            .replace(/[^a-zA-Z0-9_]/g, "_");

          tableNameInput.value = suggestedName;

          uploadPrompt.classList.add('hidden');
          fileInfo.classList.remove('hidden');
          tableNameContainer.classList.remove('hidden');
          submitBtn.disabled = false;
          hideStatus();
        },
        error: function(err) {
          showStatus('Erreur de lecture du CSV : ' + err.message, 'error');
        }
      });
    }

    removeFileBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      resetForm();
    });

    function resetForm() {
      csvHeaders = [];
      csvRows = [];
      fileInput.value = '';
      uploadPrompt.classList.remove('hidden');
      fileInfo.classList.add('hidden');
      tableNameContainer.classList.add('hidden');
      submitBtn.disabled = true;
    }

    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    submitBtn.addEventListener('click', async () => {
      const targetTableId = tableNameInput.value.trim().replace(/[^a-zA-Z0-9_]/g, "_");
      if (!targetTableId) {
        showStatus('Veuillez saisir un nom valide pour la table.', 'error');
        return;
      }

      setLoading(true);

      try {
        // 1. Définition des colonnes
        // 1. Préparer les colonnes.
        // IMPORTANT : pour l'action Grist "AddTable", les propriétés
        // id, label et type doivent être au même niveau (pas dans "fields").
        // Les noms de colonnes sont rendus uniques pour éviter les doublons
        // ou les identifiants vides après nettoyage.
        const usedColIds = new Set(["id"]);
        const columns = csvHeaders.map((header, index) => {
          const baseId = header.trim().replace(/[^a-zA-Z0-9_]/g, "_") || `colonne_${index + 1}`;
          let colId = baseId;
          let suffix = 2;

          while (usedColIds.has(colId)) {
            colId = `${baseId}_${suffix++}`;
          }
          usedColIds.add(colId);

          return {
            id: colId,
            label: header.trim() || `Colonne ${index + 1}`,
            type: "Text"
          };
        });

        // 2. Créer la table. Grist peut adapter l'identifiant si celui-ci
        // existe déjà ; on récupère donc le résultat de l'action.
        const tableResult = await grist.docApi.applyUserActions([
          ["AddTable", targetTableId, columns]
        ]);

        // applyUserActions renvoie les valeurs de retour des actions.
        // AddTable renvoie un objet contenant table_id dans les versions
        // courantes de Grist. On garde un repli sur le nom demandé.
        const createdTableId =
          tableResult?.[0]?.table_id ||
          tableResult?.[0]?.tableId ||
          targetTableId;

        console.log("Table demandée :", targetTableId);
        console.log("Table créée :", createdTableId);

        // 3. Vérifier que Grist connaît bien la table avant d'insérer les lignes.
        const tables = await grist.docApi.listTables();
        if (!tables.includes(createdTableId)) {
          throw new Error(
            `La table "${createdTableId}" n'apparaît pas dans Grist. Tables disponibles : ${tables.join(", ")}`
          );
        }

        // 4. Préparer les actions d'insertion des lignes.
        const addRecordActions = csvRows.map(row => {
          const recordFields = {};
          csvHeaders.forEach((header, idx) => {
            recordFields[columns[idx].id] =
              row[header] !== undefined && row[header] !== null
                ? String(row[header])
                : "";
          });
          return ["AddRecord", createdTableId, null, recordFields];
        });

        // 5. Envoyer les lignes par lots pour éviter une requête trop volumineuse.
        const batchSize = 100;
        for (let i = 0; i < addRecordActions.length; i += batchSize) {
          await grist.docApi.applyUserActions(
            addRecordActions.slice(i, i + batchSize)
          );
        }

        showStatus(`Table "${createdTableId}" créée et ${csvRows.length} lignes importées avec succès !`, 'success');
        resetForm();
      } catch (err) {
        console.error("Erreur Grist :", err);
        showStatus("Erreur lors de l'import : " + (err.message || err), "error");
      } finally {
        setLoading(false);
      }
    });

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      if (isLoading) {
        btnText.textContent = 'Création et import en cours...';
        btnSpinner.classList.remove('hidden');
      } else {
        btnText.textContent = 'Créer la table';
        btnSpinner.classList.add('hidden');
      }
    }

    function showStatus(text, type) {
      statusMessage.textContent = text;
      statusMessage.classList.remove('hidden', 'bg-green-100', 'text-green-700', 'bg-red-100', 'text-red-700');
      if (type === 'success') {
        statusMessage.classList.add('bg-green-100', 'text-green-700');
      } else {
        statusMessage.classList.add('bg-red-100', 'text-red-700');
      }
    }

    function hideStatus() {
      statusMessage.classList.add('hidden');
    }
  </script>
</body>
</html>
