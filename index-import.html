<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload de Fichier Grist</title>
  <!-- Inclusion du SDK Grist -->
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <!-- Tailwind CSS pour le style -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
      padding: 1rem;
    }
    .dashed-border {
      background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='16' ry='16' stroke='%23CBD5E1FF' stroke-width='3' stroke-dasharray='8%2c 8' stroke-dashoffset='0' stroke-linecap='square'/%3e%3c/svg%3e");
      border-radius: 16px;
    }
    .dashed-border.drag-over {
      background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='16' ry='16' stroke='%236366F1FF' stroke-width='3' stroke-dasharray='8%2c 8' stroke-dashoffset='0' stroke-linecap='square'/%3e%3c/svg%3e");
      background-color: #EEF2FF;
    }
  </style>
</head>
<body class="p-4">

  <div class="bg-white rounded-2xl shadow-2xl p-6 sm:p-8 max-w-md w-full text-center relative overflow-hidden">
    
    <!-- En-tête -->
    <div class="flex items-center justify-center gap-2 mb-1">
      <span class="text-2xl">📁</span>
      <h1 class="text-2xl font-bold text-slate-800">Upload de fichier</h1>
    </div>
    <p class="text-sm text-slate-500 mb-6">Glissez-déposez votre fichier ou cliquez pour le sélectionner</p>

    <!-- Zone de Drag and Drop -->
    <div 
      id="drop-zone" 
      class="dashed-border p-8 mb-6 flex flex-col items-center justify-center cursor-pointer transition-all duration-200 hover:bg-slate-50"
    >
      <input type="file" id="file-input" class="hidden" />

      <!-- Vue par défaut -->
      <div id="upload-prompt" class="flex flex-col items-center">
        <div class="w-16 h-16 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 mb-4">
          <i data-lucide="cloud-upload" class="w-8 h-8"></i>
        </div>
        <p class="text-slate-700 font-medium mb-1">Glissez votre fichier ici</p>
        <p class="text-sm text-slate-400">ou <span class="text-indigo-600 font-semibold underline">parcourez vos fichiers</span></p>
      </div>

      <!-- Vue quand un fichier est sélectionné -->
      <div id="file-info" class="hidden flex flex-col items-center w-full">
        <div class="w-12 h-12 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center mb-2">
          <i data-lucide="file-text" class="w-6 h-6"></i>
        </div>
        <p id="file-name" class="font-semibold text-slate-700 truncate max-w-full px-2">nom_du_fichier.pdf</p>
        <p id="file-size" class="text-xs text-slate-400 mt-0.5">0 KB</p>
        <button id="remove-file" type="button" class="mt-3 text-xs text-red-500 hover:text-red-700 font-medium flex items-center gap-1">
          <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Changer de fichier
        </button>
      </div>
    </div>

    <!-- Message de statut -->
    <div id="status-message" class="hidden mb-4 p-3 rounded-lg text-sm font-medium"></div>

    <!-- Bouton d'action -->
    <button 
      id="submit-btn" 
      disabled 
      class="w-full py-3.5 px-4 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-semibold rounded-xl shadow-lg shadow-indigo-200 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed disabled:shadow-none flex items-center justify-center gap-2"
    >
      <span id="btn-text">Envoyer le fichier</span>
      <i id="btn-spinner" data-lucide="loader-2" class="w-5 h-5 animate-spin hidden"></i>
    </button>
  </div>

  <script>
    // Initialisation des icônes Lucide
    lucide.createIcons();

    // Éléments du DOM
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const uploadPrompt = document.getElementById('upload-prompt');
    const fileInfo = document.getElementById('file-info');
    const fileName = document.getElementById('file-name');
    const fileSize = document.getElementById('file-size');
    const removeFileBtn = document.getElementById('remove-file');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const statusMessage = document.getElementById('status-message');

    let selectedFile = null;
    let selectedRecordId = null;

    // Initialisation de l'API Grist
    grist.ready({
      requiredAccess: 'full', // Nécessaire pour pouvoir uploader/écrire dans la base
      columns: [{ name: 'AttachmentColumn', title: 'Colonne Piece Jointe', type: 'Any' }]
    });

    // Écoute de la sélection de ligne dans Grist
    grist.onRecord((record) => {
      selectedRecordId = record ? record.id : null;
    });

    // Gestion du clic pour choisir un fichier
    dropZone.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleFile(e.target.files[0]);
      }
    });

    // Evénements Drag & Drop
    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.add('drag-over');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.classList.remove('drag-over');
      }, false);
    });

    dropZone.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      const files = dt.files;
      if (files.length > 0) {
        handleFile(files[0]);
      }
    });

    // Affichage des informations du fichier
    function handleFile(file) {
      selectedFile = file;
      fileName.textContent = file.name;
      fileSize.textContent = formatBytes(file.size);

      uploadPrompt.classList.add('hidden');
      fileInfo.classList.remove('hidden');
      submitBtn.disabled = false;
      hideStatus();
    }

    // Retirer le fichier sélectionné
    removeFileBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      resetForm();
    });

    function resetForm() {
      selectedFile = null;
      fileInput.value = '';
      uploadPrompt.classList.remove('hidden');
      fileInfo.classList.add('hidden');
      submitBtn.disabled = true;
    }

    // Envoi du fichier à Grist
    submitBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      if (!selectedRecordId) {
        showStatus('Veuillez sélectionner une ligne dans votre tableau Grist.', 'error');
        return;
      }

      setLoading(true);

      try {
        // 1. Upload du fichier comme pièce jointe dans Grist
        const attachmentIds = await grist.docApi.uploadAttachments([selectedFile]);
        
        // 2. Association de la pièce jointe à la ligne sélectionnée
        // On suppose que la colonne s'appelle 'Fichier' ou la colonne configurée dans le widget
        const mappings = await grist.setSelectedRows;
        await grist.docApi.applyUserActions([
          ['UpdateRecord', grist.getTableId(), selectedRecordId, {
            // Note: Remplacez 'Fichier' par le nom exact de votre colonne Pièce Jointe dans Grist si besoin
            Fichier: ['L', ...attachmentIds] 
          }]
        ]);

        showStatus('Fichier envoyé avec succès !', 'success');
        resetForm();
      } catch (err) {
        console.error('Erreur lors de l\'envoi :', err);
        showStatus('Erreur lors de l\'envoi du fichier : ' + err.message, 'error');
      } finally {
        setLoading(false);
      }
    });

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      if (isLoading) {
        btnText.textContent = 'Envoi en cours...';
        btnSpinner.classList.remove('hidden');
      } else {
        btnText.textContent = 'Envoyer le fichier';
        btnSpinner.classList.add('hidden');
      }
    }

    function showStatus(text, type) {
      statusMessage.textContent = text;
      statusMessage.classList.remove('hidden', 'bg-green-100', 'text-green-700', 'bg-red-100', 'text-red-700');
      if (type === 'success') {
        statusMessage.classList.add('bg-green-100', 'text-green-700');
      } else {
        statusMessage.classList.add('bg-red-100', 'text-red-700');
      }
    }

    function hideStatus() {
      statusMessage.classList.add('hidden');
    }

    function formatBytes(bytes, decimals = 2) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const dm = decimals < 0 ? 0 : decimals;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
    }
  </script>
</body>
</html>
